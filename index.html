<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PC1 — Past Year Exams</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧫</text></svg>"
    />
    <style>
      :root {
        --bg: #0a0e14;
        --bg-2: #10151d;
        --bg-3: #171d28;
        --card: #121821;
        --card-hover: #1a2130;
        --border: #1f2836;
        --border-2: #2b3648;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --text-faint: #5a6472;
        --accent: #00bfa5;
        --accent-2: #4d9fff;
        --green: #2ecc71;
        --green-bg: #123a25;
        --green-border: #1e5c3a;
        --red: #e74c3c;
        --red-bg: #3a1818;
        --red-border: #5c2424;
        --blue: #4d9fff;
        --yellow: #f5b800;
        --radius: 16px;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        overscroll-behavior-y: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
        font-size: inherit;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-2);
        border-radius: 4px;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px 10px;
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(180deg, var(--bg) 75%, transparent);
        backdrop-filter: blur(10px);
      }
      .logo-wrap {
        display: flex;
        align-items: center;
        gap: 11px;
        flex: 1;
        min-width: 0;
      }
      .logo-badge {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 13px;
        color: #fff;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 14px rgba(124, 77, 255, 0.35);
      }
      .logo-text {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .logo-sub {
        font-size: 11px;
        color: var(--text-dim);
        font-weight: 500;
      }
      .logo-wrap > div:last-child {
        min-width: 0;
        overflow: hidden;
      }
      .logo-text,
      .logo-sub {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .icon-btn:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .icon-btn:active {
        transform: scale(0.95);
      }

      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 18px 14px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-dim);
        flex-wrap: wrap;
      }
      .crumb {
        color: var(--text-dim);
        transition: color 0.15s;
        padding: 2px 0;
      }
      .crumb.link {
        cursor: pointer;
      }
      .crumb.link:hover {
        color: var(--accent);
      }
      .crumb.current {
        color: var(--text);
        font-weight: 700;
      }
      .crumb-sep {
        opacity: 0.35;
      }

      .search-wrap {
        margin: 4px 18px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 13px 15px;
        transition: border-color 0.2s;
      }
      .search-wrap:focus-within {
        border-color: var(--accent-2);
      }
      .search-wrap svg {
        flex-shrink: 0;
        opacity: 0.55;
      }
      .search-wrap input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
      }
      .search-wrap input::placeholder {
        color: var(--text-faint);
      }

      .hero {
        margin: 0 18px 20px;
        padding: 22px 20px;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          rgba(0, 191, 165, 0.12),
          rgba(124, 77, 255, 0.12)
        );
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(0, 191, 165, 0.25),
          transparent 70%
        );
        pointer-events: none;
      }
      .hero-title {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }
      .hero-sub {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.55;
      }

      .continue-card {
        margin: 0 18px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 14px;
        padding: 14px 16px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
        width: calc(100% - 36px);
      }
      .continue-card:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
        border-left-color: var(--accent);
        transform: translateY(-1px);
      }
      .continue-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--bg-3);
        display: grid;
        place-items: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .continue-body {
        flex: 1;
        min-width: 0;
      }
      .continue-label {
        font-size: 10px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 3px;
      }
      .continue-title {
        font-size: 14px;
        font-weight: 700;
      }
      .continue-meta {
        font-size: 11.5px;
        color: var(--text-dim);
        margin-top: 2px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 800;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        padding: 0 18px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-title .count {
        background: var(--bg-3);
        color: var(--text-dim);
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
      }

      .list {
        padding: 0 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .course-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        text-align: left;
        width: 100%;
        transition:
          transform 0.15s,
          border-color 0.2s,
          background 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--course-color, var(--accent));
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover::before {
        opacity: 1;
      }
      .course-card:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .course-card:active {
        transform: scale(0.985);
      }

      .course-thumb {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 24px;
        background: var(--course-bg, rgba(0, 191, 165, 0.12));
        border: 1px solid var(--course-border, rgba(0, 191, 165, 0.3));
      }
      .course-body {
        flex: 1;
        min-width: 0;
      }
      .course-title {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 4px;
        letter-spacing: -0.2px;
      }
      .course-meta {
        font-size: 12px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .course-meta .dot {
        opacity: 0.4;
      }
      .progress-bar {
        margin-top: 10px;
        height: 5px;
        background: var(--bg-3);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(
          90deg,
          var(--course-color, var(--accent)),
          var(--course-color-2, var(--accent-2))
        );
        transition: width 0.4s ease;
      }
      .course-arrow {
        color: var(--text-faint);
        flex-shrink: 0;
      }

      .year-list {
        padding: 0 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .year-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 15px 16px;
        text-align: left;
        width: 100%;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }
      .year-card:hover {
        background: var(--card-hover);
        border-color: var(--border-2);
        transform: translateY(-1px);
      }
      .year-card:active {
        transform: scale(0.985);
      }
      .year-card .badge-year {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -0.3px;
        padding: 8px 14px;
        border-radius: 11px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        color: var(--text);
        flex-shrink: 0;
        min-width: 68px;
        text-align: center;
      }
      .year-card .year-body {
        flex: 1;
        min-width: 0;
      }
      .year-card .year-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .year-card .year-meta {
        font-size: 11.5px;
        color: var(--text-dim);
      }
      .year-card .year-status {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.8px;
        padding: 4px 9px;
        border-radius: 7px;
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .year-status.new {
        color: var(--blue);
        background: rgba(77, 159, 255, 0.14);
      }
      .year-status.progress {
        color: var(--yellow);
        background: rgba(245, 184, 0, 0.14);
      }
      .year-status.done {
        color: var(--green);
        background: var(--green-bg);
      }

      .empty-state {
        text-align: center;
        padding: 60px 24px;
        color: var(--text-dim);
        font-size: 14px;
      }
      .empty-state .emoji {
        font-size: 44px;
        margin-bottom: 14px;
        display: block;
        opacity: 0.6;
      }
      .empty-state .title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
      }
      .empty-state .desc {
        font-size: 13px;
        color: var(--text-dim);
        max-width: 300px;
        margin: 0 auto;
        line-height: 1.6;
      }

      .quiz-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(10, 14, 20, 0.94);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
        width: 100%;
      }
      .quiz-header-info {
        flex: 1 1 0;
        min-width: 0;
        text-align: center;
        overflow: hidden;
      }
      .quiz-header-title {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .quiz-header-count {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 1px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .quiz-progress {
        height: 3px;
        background: var(--bg-3);
        position: sticky;
        top: 65px;
        z-index: 19;
        width: 100%;
      }
      .quiz-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.3s ease;
      }

      .quiz-body {
        padding: 20px 18px 30px;
        flex: 1;
      }
      .breadcrumb {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1px;
        color: var(--text-faint);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .breadcrumb .dot {
        color: var(--accent);
        margin: 0 7px;
      }
      .quiz-title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }
      .quiz-section {
        font-size: 13px;
        color: var(--text-dim);
        font-style: italic;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 22px;
      }

      .q-tag-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .q-number {
        font-size: 12px;
        font-weight: 800;
        color: var(--text-faint);
        letter-spacing: 0.5px;
      }
      .q-topic {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.7px;
        padding: 4px 9px;
        border-radius: 7px;
        color: var(--blue);
        background: rgba(77, 159, 255, 0.14);
        text-transform: uppercase;
        margin-left: 9px;
      }
      .q-meta-badges {
        display: flex;
        gap: 6px;
      }
      .meta-badge {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 4px 9px;
        border-radius: 7px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .meta-badge.streak {
        color: var(--yellow);
        background: rgba(245, 184, 0, 0.14);
      }

      .q-text {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.55;
        margin-bottom: 22px;
        letter-spacing: -0.2px;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 22px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 13px;
        background: var(--card);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 15px 16px;
        text-align: left;
        font-size: 14px;
        line-height: 1.5;
        color: var(--text);
        transition: all 0.18s;
        width: 100%;
      }
      .option:hover:not(.locked) {
        border-color: var(--accent-2);
        background: var(--card-hover);
      }
      .option:active:not(.locked) {
        transform: scale(0.99);
      }
      .option .letter {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .option.correct {
        background: var(--green-bg);
        border-color: var(--green-border);
      }
      .option.correct .letter {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }
      .option.wrong {
        background: var(--red-bg);
        border-color: var(--red-border);
      }
      .option.wrong .letter {
        background: var(--red);
        color: #fff;
        border-color: var(--red);
      }
      .option.locked {
        cursor: default;
      }

      .result-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 18px;
        padding: 12px 16px;
        border-radius: 12px;
        letter-spacing: 0.2px;
        animation: slideDown 0.25s ease;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .result-row.correct {
        color: var(--green);
        background: rgba(46, 204, 113, 0.08);
        border: 1px solid var(--green-border);
      }
      .result-row.wrong {
        color: var(--red);
        background: rgba(231, 76, 60, 0.08);
        border: 1px solid var(--red-border);
      }

      .action-btns {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .action-btn {
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all 0.2s;
      }
      .action-btn:hover {
        border-color: var(--border-2);
        background: var(--card-hover);
      }
      .action-btn.active {
        background: var(--accent-2);
        border-color: var(--accent-2);
        color: #fff;
      }

      .explanation {
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-left: 3px solid var(--blue);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 20px;
        animation: slideDown 0.25s ease;
      }
      .explanation-label {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        color: var(--blue);
        text-transform: uppercase;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .explanation-text {
        font-size: 14px;
        line-height: 1.7;
        color: #c9d1d9;
      }
      .explanation-text strong {
        color: var(--text);
        font-weight: 700;
      }

      .q-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 22px;
        padding: 16px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .q-nav-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--bg-3);
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 800;
        color: var(--text-dim);
        transition: all 0.15s;
      }
      .q-nav-btn:hover {
        border-color: var(--border-2);
        color: var(--text);
      }
      .q-nav-btn.current {
        background: var(--accent-2);
        color: #fff;
        border-color: var(--accent-2);
        transform: scale(1.05);
      }
      .q-nav-btn.answered-correct {
        background: var(--green-bg);
        color: var(--green);
        border-color: var(--green-border);
      }
      .q-nav-btn.answered-wrong {
        background: var(--red-bg);
        color: var(--red);
        border-color: var(--red-border);
      }

      .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .nav-btn {
        flex: 1;
        padding: 15px;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 800;
        background: var(--bg-3);
        border: 1px solid var(--border);
        transition: all 0.2s;
        letter-spacing: 0.2px;
      }
      .nav-btn:hover:not(:disabled) {
        background: var(--card-hover);
        border-color: var(--border-2);
      }
      .nav-btn.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        border-color: transparent;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 191, 165, 0.3);
      }
      .nav-btn.primary:hover:not(:disabled) {
        box-shadow: 0 6px 20px rgba(0, 191, 165, 0.4);
        transform: translateY(-1px);
      }
      .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .finish-card {
        margin: 20px 18px;
        padding: 32px 24px;
        background: linear-gradient(
          135deg,
          rgba(0, 191, 165, 0.08),
          rgba(124, 77, 255, 0.08)
        );
        border: 1px solid var(--border);
        border-radius: 20px;
        text-align: center;
      }
      .finish-emoji {
        font-size: 56px;

        return `

                                                    ${p.total} questions

                                                  </div>

                                              </button>
                                            `;
      }

      function bindCourseEvents() {
        const search = document.getElementById("searchInput");
        if (search) {
          search.addEventListener("input", (e) => {
            state.search = e.target.value;
            renderCourses();
            const s2 = document.getElementById("searchInput");
            if (s2) {
              s2.focus();
              s2.setSelectionRange(s2.value.length, s2.value.length);
            }
          });
        }
        document.querySelectorAll("[data-course]").forEach((el) => {
          el.addEventListener("click", () => {
            state.course = el.dataset.course;
            state.topic = null;
            state.view = "years";
            state.search = "";
            render();
            window.scrollTo(0, 0);
          });
        });

        const resetBtn = document.getElementById("resetBtn");
        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            if (
              !confirm(
                "⚠️ Reset ALL progress?\n\nThis will erase all your answered questions and start fresh. This cannot be undone.",
              )
            )
              return;
            localStorage.removeItem(STORAGE_KEY);
            state.progress = {};
            state.streak = 0;
            state.startTime = null;
            showToast("✓ All progress reset");
            render();
            window.scrollTo(0, 0);
          });
        }

        const bookmarksBtn = document.getElementById("bookmarksBtn");
        if (bookmarksBtn) {
          bookmarksBtn.addEventListener("click", () => {
            state.view = "bookmarks";
            render();
            window.scrollTo(0, 0);
          });
        }

        document.querySelectorAll("[data-open-notes-quick]").forEach((el) => {
          el.addEventListener("click", () => {
            state.view = "notes";
            state.noteSubject = null;
            render();
            window.scrollTo(0, 0);
          });
        });
        document.querySelectorAll("[data-open-ppts-quick]").forEach((el) => {
          el.addEventListener("click", () => {
            state.view = "ppts";
            state.pptSubject = null;
            state.pptTeacher = null;
            render();
            window.scrollTo(0, 0);
          });
        });

        document.querySelectorAll("[data-continue]").forEach((el) => {
          el.addEventListener("click", () => {
            const exam = QUIZ_DATA.find((e) => e.id === el.dataset.continue);
            if (!exam) return;
            state.course = exam.subject;
            state.exam = exam;
            const p = state.progress[exam.id] || {};
            const answered = Object.keys(p)
              .map(Number)
              .sort((a, b) => a - b);
            state.qIndex =
              answered.length > 0 ? answered[answered.length - 1] : 0;
            state.showExplanation = false;
            state.streak = 0;
            state.startTime = Date.now();
            state.view = "quiz";
            render();
            window.scrollTo(0, 0);
          });
        });

        document.querySelectorAll("[data-open-bookmarks]").forEach((el) => {
          el.addEventListener("click", () => {
            state.view = "bookmarks";
            render();
            window.scrollTo(0, 0);
          });
        });
      }

        const p = getExamProgress(exam);

          statusLabel = "New";

          status = "progress";
          statusLabel = "In Progress";

        return `

                                    <div class="course-meta">${sec.files.length} ${sec.files.length === 1 ? "file" : "files"}</div>
                                  </div>
                                  <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
                                </button>
                              `,
                                )
                                .join("")}
                            </div>
                          `
                        }
                                            `;

        const back = document.getElementById("backBtn");
        if (back)
          back.addEventListener("click", () => {
            state.view = "ppts";
            state.pptSubject = null;
            render();
            window.scrollTo(0, 0);
          });
        document.querySelectorAll("[data-crumb-ppts]").forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.crumbPpts;
            state.view = target === "courses" ? "courses" : "ppts";
            state.pptSubject = null;
            state.pptTeacher = null;
            render();
            window.scrollTo(0, 0);
          });
        });
        document.querySelectorAll("[data-ppt-section]").forEach((el) => {
          el.addEventListener("click", () => {
            state.pptTeacher = el.dataset.pptSection;
            state.view = "ppt-files";
            render();
            window.scrollTo(0, 0);
          });
        });
      }

      /* =====================================================================
                                                                 PPTs — FILES
                                                                 ===================================================================== */
      function renderPptsFiles() {
        const subjectData = PPTS_DATA.find((s) => s.id === state.pptSubject);
        if (!subjectData) {
          state.view = "ppts";
          return render();
        }
        const section = (subjectData.sections || []).find(
          (s) => s.name === state.pptTeacher,
        );
        if (!section) {
          state.view = "ppt-teachers";
          return render();
        }
        const style = getCourseStyle(subjectData.subject);

        app.innerHTML = `
                                              <header class="topbar">
                                                <div class="logo-wrap">
                                                  <button class="icon-btn" id="backBtn" title="Back" style="margin-right: 4px;">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                                  </button>
                                                  <div class="logo-badge" style="background:linear-gradient(135deg,${style.color},${style.color2});">${section.icon || "📄"}</div>
                                                  <div>
                                                    <div class="logo-text">${escapeHtml(section.name)}</div>
                                                    <div class="logo-sub">${section.files.length} ${section.files.length === 1 ? "file" : "files"}</div>
                                                  </div>
                                                </div>
                                              </header>

                                              <div class="crumbs">
                                                <span class="crumb link" data-crumb-ppts="courses">Courses</span>
                                                <span class="crumb-sep">›</span>
                                                <span class="crumb link" data-crumb-ppts="ppts">PPTs</span>
                                                <span class="crumb-sep">›</span>
                                                <span class="crumb link" data-crumb-ppts="subject">${escapeHtml(subjectData.subject)}</span>
                                                <span class="crumb-sep">›</span>
                                                <span class="crumb current">${escapeHtml(section.name)}</span>
                                              </div>

                                              <div class="section-title">
                                                Files
                                                <span class="count">${section.files.length}</span>
                                              </div>

             <div class="list">
              ${section.files
                .map(
                  (f) => `
                <a class="course-card" href="${escapeHtml(f.file)}" target="_blank" rel="noopener" style="--course-color:${style.color};--course-color-2:${style.color2};--course-bg:${style.bg};--course-border:${style.border};text-decoration:none;color:inherit;">
                  <div class="course-thumb" style="background:${style.bg};border-color:${style.border};">📄</div>
                  <div class="course-body">
                    <div class="course-title" style="font-size:15px;">${escapeHtml(f.title)}</div>
                    <div class="course-meta">
                      <span style="color:${style.color};font-weight:700;">PDF</span>
                      <span class="dot">·</span>
                      <span>Tap to open</span>
                    </div>
                  </div>
                  <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
                </a>
              `,
                )
                .join("")}
            </div>
                  `;

        const back = document.getElementById("backBtn");
        if (back)
          back.addEventListener("click", () => {
            state.view = "ppt-teachers";
            state.pptTeacher = null;
            render();
            window.scrollTo(0, 0);
          });
        document.querySelectorAll("[data-crumb-ppts]").forEach((el) => {
          el.addEventListener("click", () => {
            const target = el.dataset.crumbPpts;
            if (target === "courses") {
              state.view = "courses";
              state.pptSubject = null;
              state.pptTeacher = null;
            } else if (target === "ppts") {
              state.view = "ppts";
              state.pptSubject = null;
              state.pptTeacher = null;
            } else if (target === "subject") {
              state.view = "ppt-teachers";
              state.pptTeacher = null;
            }
            render();
            window.scrollTo(0, 0);
          });
        });
      }

      /* =====================================================================
                                                                 BOOKMARKS LIST VIEW
                                                                 ===================================================================== */
      function renderBookmarks() {
        const items = [];
        Object.entries(state.bookmarks).forEach(([examId, qs]) => {
          const exam = QUIZ_DATA.find((e) => e.id === examId);
          if (!exam) return;
          Object.keys(qs).forEach((qIdxStr) => {
            const qIdx = parseInt(qIdxStr);
            const question = exam.questions[qIdx];
            if (!question) return;
            items.push({ exam, qIdx, question });
          });
        });

        app.innerHTML = `
                                              <header class="topbar">
                                                <div class="logo-wrap">
                                                  <button class="icon-btn" id="backBtn" title="Back" style="margin-right: 4px;">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                                  </button>
                                                  <div class="logo-badge" style="background:linear-gradient(135deg,#f5b800,#ff6d00);">⭐</div>
                                                  <div>
                                                    <div class="logo-text">Bookmarks</div>
                                                    <div class="logo-sub">${items.length} ${items.length === 1 ? "question" : "questions"} saved</div>
                                                  </div>
                                                </div>
                                              </header>

                                              <div class="crumbs">
                                                <span class="crumb link" data-crumb-bookmarks="courses">Courses</span>
                                                <span class="crumb-sep">›</span>
                                                <span class="crumb current">Bookmarks</span>
                                              </div>

                                              ${
                                                items.length === 0
                                                  ? `
                                                <div class="empty-state">
                                                  <span class="emoji">⭐</span>
                                                  <div class="title">No bookmarks yet</div>
                                                  <div class="desc">Open any exam and tap the bookmark icon in the header to save a question for later.</div>
                                                </div>
                                              `
                                                  : `
                                                <div class="section-title">
                                                  Saved Questions
                                                  <span class="count">${items.length}</span>
                                                </div>
                                                <div class="list">
                                                  ${items.map(renderBookmarkCard).join("")}
                                                </div>
                                              `
                                              }
                                            `;

        const back = document.getElementById("backBtn");
        if (back)
          back.addEventListener("click", () => {
            state.view = "courses";
            render();
            window.scrollTo(0, 0);
          });
        document.querySelectorAll("[data-crumb-bookmarks]").forEach((el) => {
          el.addEventListener("click", () => {
            state.view = "courses";
            render();
            window.scrollTo(0, 0);
          });
        });
        document.querySelectorAll("[data-bookmark-exam]").forEach((el) => {
          el.addEventListener("click", () => {
            const examId = el.dataset.bookmarkExam;
            const qIdx = parseInt(el.dataset.bookmarkQ);
            const exam = QUIZ_DATA.find((e) => e.id === examId);
            if (!exam) return;
            state.course = exam.subject;
            state.exam = exam;
            state.qIndex = qIdx;
            state.showExplanation = false;
            state.streak = 0;
            state.startTime = Date.now();
            state.view = "quiz";
            render();
            window.scrollTo(0, 0);
          });
        });
      }

      function renderBookmarkCard({ exam, qIdx, question }) {
        const style = getCourseStyle(exam.subject);
        const qText =
          question.q.length > 120
            ? question.q.slice(0, 120).trim() + "…"
            : question.q;
        return `
                                              <button class="course-card" data-bookmark-exam="${exam.id}" data-bookmark-q="${qIdx}" style="--course-color:${style.color};--course-color-2:${style.color2};--course-bg:${style.bg};--course-border:${style.border};">
                                                <div class="course-thumb" style="background:${style.bg};border-color:${style.border};">${style.icon}</div>
                                                <div class="course-body">
                                                  <div class="course-title" style="font-size:14px;">${escapeHtml(exam.subject)} — ${escapeHtml(exam.title)}</div>
                                                  <div class="course-meta" style="margin-bottom:6px;">
                                                    <span style="color:${style.color};font-weight:800;">Q${qIdx + 1}</span>
                                                    <span class="dot">·</span>
                                                    <span>${escapeHtml(exam.topic)}</span>
                                                  </div>
                                                  <div style="font-size:12.5px;color:var(--text-dim);line-height:1.5;">${escapeHtml(qText)}</div>
                                                </div>
                                                <svg class="course-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
                                              </button>
                                            `;
      }

      /* =====================================================================
                                                                 QUIZ VIEW
                                                                 ===================================================================== */
      function renderQuiz() {
        const exam = state.exam;
        const q = exam.questions[state.qIndex];
        const progress = state.progress[exam.id] || {};
        const savedAnswer = progress[state.qIndex];
        const answered = !!savedAnswer;
        const isCorrect = answered && savedAnswer.correct;
        const pct = Math.round(
          ((state.qIndex + 1) / exam.questions.length) * 100,
        );

        const optionsHTML = q.options
          .map((opt) => {
            let cls = "option";
            if (answered) {
              cls += " locked";
              if (opt.letter === q.correct) cls += " correct";
              else if (opt.letter === savedAnswer.chosen) cls += " wrong";
            }
            return `
                                                <button class="${cls}" data-letter="${opt.letter}">
                                                  <span class="letter">${opt.letter}</span>
                                                  <span>${escapeHtml(opt.text)}</span>
                                                </button>
                                              `;
          })
          .join("");

        const qNavHTML = exam.questions
          .map((_, i) => {
            const p = progress[i];
            let cls = "q-nav-btn";
            if (i === state.qIndex) cls += " current";
            else if (p)
              cls += p.correct ? " answered-correct" : " answered-wrong";
            return `<button class="${cls}" data-qnav="${i}">${i + 1}</button>`;
          })
          .join("");

        const allAnswered =
          Object.keys(progress).length === exam.questions.length;

        app.innerHTML = `
                                              <div class="quiz-header">
                                                <button class="icon-btn" id="backBtn" title="Back to years">
                                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                                                </button>
                                                <div class="quiz-header-info">
                                                  <div class="quiz-header-title">${escapeHtml(exam.title)}</div>
                                                  <div class="quiz-header-count">Q${state.qIndex + 1} of ${exam.questions.length}</div>
                                                </div>
                                                <button class="icon-btn" id="bookmarkBtn" title="Bookmark this question" style="${isBookmarked(exam.id, state.qIndex) ? "background:rgba(245,184,0,0.15);border-color:rgba(245,184,0,0.5);color:#f5b800;" : ""}">
                                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="${isBookmarked(exam.id, state.qIndex) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
                                                </button>
                                                <button class="icon-btn" id="closeBtn" title="Close">
                                                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                                </button>
                                              </div>
                                              <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>

                                              <div class="quiz-body">
                                                <div class="breadcrumb">
                                                  ${escapeHtml(exam.subject.toUpperCase())}
                                                  <span class="dot">·</span>
                                                  ${exam.year}
                                                  <span class="dot">·</span>
                                                  ${escapeHtml((exam.topic || "").toUpperCase())}
                                                </div>
                                                <div class="quiz-title">${escapeHtml(exam.title)}</div>
                                                <div class="quiz-section">${escapeHtml(exam.section || "")}</div>

                                                <div class="q-tag-row">
                                                  <div>
                                                    <span class="q-number">Q${state.qIndex + 1}</span>
                                                    ${exam.topic ? `<span class="q-topic">${escapeHtml(exam.topic)}</span>` : ""}
                                                  </div>
                                                  <div class="q-meta-badges">
                                                    ${state.streak > 1 ? `<span class="meta-badge streak">🔥 ${state.streak} streak</span>` : ""}
                                                  </div>
                                                </div>

                                                <div class="q-text">${escapeHtml(q.q)}</div>
                                                <div class="options">${optionsHTML}</div>

                                                ${
                                                  answered
                                                    ? `
                                                  <div class="result-row ${isCorrect ? "correct" : "wrong"}">
                                                    ${isCorrect ? "✓ Correct" : "✗ Incorrect — correct answer is " + q.correct}
                                                  </div>
                                                  <div class="action-btns">
                                                    <button class="action-btn ${state.showExplanation ? "active" : ""}" id="explBtn">
                                                      ${state.showExplanation ? "Hide Explanation" : "Show Explanation"}
                                                    </button>
                                                  </div>
                                                  ${
                                                    state.showExplanation
                                                      ? `
                                                    <div class="explanation">
                                                      <div class="explanation-label">Explanation</div>
                                                      <div class="explanation-text">${(q.explanation || "No explanation provided.").replace(/\n/g, "<br>")}</div>
                                                    </div>
                                                  `
                                                      : ""
                                                  }
                                                `
                                                    : ""
                                                }

                                                <div class="q-nav">${qNavHTML}</div>

                                                <div class="nav-buttons">
                                                  <button class="nav-btn" id="prevBtn" ${state.qIndex === 0 ? "disabled" : ""}>← Previous</button>
                                                  ${
                                                    state.qIndex ===
                                                    exam.questions.length - 1
                                                      ? `<button class="nav-btn primary" id="finishBtn">${allAnswered ? "See Results →" : "Next →"}</button>`
                                                      : `<button class="nav-btn primary" id="nextBtn">Next →</button>`
                                                  }
                                                </div>
                                              </div>
                                            `;

        bindQuizEvents();
      }

      function bindQuizEvents() {
        const exam = state.exam;
        const q = exam.questions[state.qIndex];

        document
          .getElementById("backBtn")
          .addEventListener("click", goBackToYears);
        document
          .getElementById("closeBtn")
          .addEventListener("click", goBackToYears);

        const bookmarkBtn = document.getElementById("bookmarkBtn");
        if (bookmarkBtn) {
          bookmarkBtn.addEventListener("click", () => {
            toggleBookmark(exam.id, state.qIndex);
            renderQuiz();
          });
        }

        const progress = state.progress[exam.id] || {};
        const answered = !!progress[state.qIndex];

        if (!answered) {
          document.querySelectorAll(".option").forEach((opt) => {
            opt.addEventListener("click", () => pickAnswer(opt.dataset.letter));
          });
        }

        const explBtn = document.getElementById("explBtn");
        if (explBtn) {
          explBtn.addEventListener("click", () => {
            state.showExplanation = !state.showExplanation;
            renderQuiz();
          });
        }

        document.querySelectorAll("[data-qnav]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.qIndex = parseInt(btn.dataset.qnav);
            state.showExplanation = false;
            renderQuiz();
            window.scrollTo(0, 0);
          });
        });

        const prev = document.getElementById("prevBtn");
        const next = document.getElementById("nextBtn");
        const finish = document.getElementById("finishBtn");
        if (prev)
          prev.addEventListener("click", () => {
            if (state.qIndex > 0) {
              state.qIndex--;
              state.showExplanation = false;
              renderQuiz();
              window.scrollTo(0, 0);
            }
          });
        if (next)
          next.addEventListener("click", () => {
            if (state.qIndex < exam.questions.length - 1) {
              state.qIndex++;
              state.showExplanation = false;
              renderQuiz();
              window.scrollTo(0, 0);
            }
          });
        if (finish)
          finish.addEventListener("click", () => {
            state.view = "finish";
            render();
            window.scrollTo(0, 0);
          });
      }

      function pickAnswer(chosen) {
        const exam = state.exam;
        const q = exam.questions[state.qIndex];
        if (!state.progress[exam.id]) state.progress[exam.id] = {};
        const wasCorrect = chosen === q.correct;
        state.progress[exam.id][state.qIndex] = {
          chosen,
          correct: wasCorrect,
          t: Date.now(),
        };
        saveProgress();
        if (wasCorrect) {
          state.streak = (state.streak || 0) + 1;
          if (state.streak >= 3)
            showToast(`🔥 ${state.streak} correct in a row!`);
        } else {
          state.streak = 0;
        }
        state.showExplanation = false;
        renderQuiz();
        setTimeout(() => {
          const r = document.querySelector(".result-row");
          if (r) r.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 50);
      }

      function goBackToYears() {
        state.view = "years";
        state.exam = null;
        render();
        window.scrollTo(0, 0);
      }

      /* =====================================================================
                                                                 FINISH VIEW
                                                                 ===================================================================== */
      function renderFinish() {
        const exam = state.exam;
        const p = getExamProgress(exam);
        const pct = p.total ? Math.round((p.correct / p.total) * 100) : 0;
        const elapsed = state.startTime
          ? Math.round((Date.now() - state.startTime) / 1000)
          : 0;
        const mins = Math.floor(elapsed / 60);
        const secs = elapsed % 60;

        let emoji = "🎉",
          title = "Great job!",
          sub = "You finished the exam.";
        if (pct === 100) {
          emoji = "🏆";
          title = "Perfect score!";
          sub = "You aced every question.";
        } else if (pct >= 80) {
          emoji = "🌟";
          title = "Excellent!";
          sub = "You're well prepared.";
        } else if (pct >= 60) {
          emoji = "👍";
          title = "Good work!";
          sub = "Keep practicing to improve.";
        } else if (pct >= 40) {
          emoji = "📖";
          title = "Keep going!";
          sub = "Review the explanations and try again.";
        } else {
          emoji = "💪";
          title = "Don't give up!";
          sub = "Practice makes perfect — review and retry.";
        }

        app.innerHTML = `
                                              <header class="topbar">
                                                <div class="logo-wrap">
                                                  <div class="logo-badge">PC1</div>
                                                  <div>
                                                    <div class="logo-text">Results</div>
                                                    <div class="logo-sub">${escapeHtml(exam.title)}</div>
                                                  </div>
                                                </div>
                                              </header>

                                              <div class="finish-card">
                                                <span class="finish-emoji">${emoji}</span>
                                                <div class="finish-title">${title}</div>
                                                <div class="finish-sub">${sub}</div>
                                                <div class="finish-score">${pct}%</div>
                                                <div class="finish-score-label">${p.correct} of ${p.total} correct · ${mins}m ${secs}s</div>
                                                <div class="finish-btns">
                                                  <button class="nav-btn" id="reviewBtn" style="flex:0;padding:14px 22px;">Review</button>
                                                  <button class="nav-btn" id="backToYearsBtn" style="flex:0;padding:14px 22px;">Back to Years</button>
                                                  <button class="nav-btn primary" id="retryBtn" style="flex:0;padding:14px 22px;">Retry</button>
                                                </div>
                                              </div>
                                            `;

        document.getElementById("reviewBtn").addEventListener("click", () => {
          state.qIndex = 0;
          state.showExplanation = false;
          state.view = "quiz";
          render();
          window.scrollTo(0, 0);
        });
        document
          .getElementById("backToYearsBtn")
          .addEventListener("click", () => {
            state.view = "years";
            state.exam = null;
            render();
            window.scrollTo(0, 0);
          });
        document.getElementById("retryBtn").addEventListener("click", () => {
          if (!confirm("Clear your answers for this exam and start over?"))
            return;
          delete state.progress[exam.id];
          saveProgress();
          state.qIndex = 0;
          state.showExplanation = false;
          state.streak = 0;
          state.startTime = Date.now();
          state.view = "quiz";
          render();
          window.scrollTo(0, 0);
        });
      }

      /* =====================================================================
                                                                 KEYBOARD SHORTCUTS
                                                                 ===================================================================== */
      document.addEventListener("keydown", (e) => {
        if (state.view === "quiz") {
          if (
            ["1", "2", "3", "4", "5", "a", "b", "c", "d", "e"].includes(
              e.key.toLowerCase(),
            )
          ) {
            const map = {
              1: "A",
              2: "B",
              3: "C",
              4: "D",
              5: "E",
              a: "A",
              b: "B",
              c: "C",
              d: "D",
              e: "E",
            };
            const letter = map[e.key.toLowerCase()];
            const opt = document.querySelector(
              `.option[data-letter="${letter}"]:not(.locked)`,
            );
            if (opt) opt.click();
          } else if (e.key === "ArrowRight") {
            const n = document.getElementById("nextBtn");
            if (n) n.click();
          } else if (e.key === "ArrowLeft") {
            const p = document.getElementById("prevBtn");
            if (p && !p.disabled) p.click();
          } else if (e.key === "Escape") {
            goBackToYears();
          }
        } else if (state.view === "years") {
          if (e.key === "Escape") {
            state.view = "courses";
            state.course = null;
            render();
          }
        }
      });

      /* =====================================================================
                                                                 BOOT
                                          ===================================================================== */
      render();
    </script>
  </body>
</html>
